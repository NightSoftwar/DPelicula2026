<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="./assets/DPelicula2026.ico" type="image/x-icon">
  <title>DPelicula2026</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="./general.css">

  <meta name="description"
    content="Descubre las mejores películas y series, con reseñas, tráilers e información detallada.">
  <meta name="keywords" content="películas, cine, series, estrenos, Marvel, Netflix, acción, drama, comedia" />
  <meta name="author" content="DPelicula" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://nightsoftwar.github.io/DPelicula2026/" />
  <meta property="og:title" content="DPelicula 2026 - Tu Portal de Cine" />
  <meta property="og:description" content="Explora información de tus películas favoritas, estrenos y más." />
  <meta property="og:image" content="https://nightsoftwar.github.io/DPelicula2026/assets/DPelicula.png" />

  <!-- 🔹 Twitter Card (para X / Twitter) -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://nightsoftwar.github.io/DPelicula2026/" />
  <meta name="twitter:title" content="DPelicula 2026 - Tu Portal de Cine" />
  <meta name="twitter:description" content="Explora información de tus películas favoritas, estrenos y más." />
  <meta name="twitter:image" content="https://nightsoftwar.github.io/DPelicula2026/assets/cine-banner.jpg" />

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />


</head>

<body>
  <header>
    <div class="logo">
      <span class="highlight">DP</span>elicula2026
    </div>
    <div class="menu-icon" id="menuBtn">☰</div>
  </header>

  <nav class="mobile-menu" id="mobileMenu">
    <a href="./index.html">Inicio</a>
    <a href="./login.html">Iniciar Sección</a>
  </nav>

  <div class="search-bar">
    <input type="text" placeholder="Buscar película...">
  </div>
  <div class="filters">
    <select id="filtroGenero">
      <option value="">Todos los géneros</option>
    </select>

    <select id="filtroAnio">
      <option value="">Todos los años</option>
    </select>
  </div>
  <section class="novedades-container">
    <h2 class="page-title">✨ Últimas novedades</h2>
    <div class="swiper novedades-swiper">
      <div class="swiper-wrapper" id="novedadesLista">
        <!-- Aquí van las cards -->
      </div>

      <!-- Flechas -->
      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>

      <!-- Paginación -->
      <div class="swiper-pagination"></div>
    </div>
  </section>

  <main class="movies-container">
    <h2 class="page-title">🎬 Películas</h2>

    <div id="peliculasLista" class="peliculas-grid">
      <!-- Aquí se insertan las tarjetas -->
    </div>
  </main>
  <div class="logout-modal" id="logoutModal">
    <div class="logout-content">
      <h2>¿Cerrar sesión?</h2>
      <p id="logoutMessage">Tu sesión actual se cerrará.</p>
      <div class="logout-actions">
        <button id="cancelLogout" class="btn-cancel">Cancelar</button>
        <button id="confirmLogout" class="btn-confirm">Cerrar Sesión</button>
      </div>
    </div>
  </div>
  <script src="index.js" type="module"></script>
  <script src="./general.js"></script>
  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

</body>

</html>
